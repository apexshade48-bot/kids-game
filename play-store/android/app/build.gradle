plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wordstars.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.wordstars.app"
        minSdk 24
        targetSdk 35
        versionCode 90
        versionName "9.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
