services:
  - type: web
    name: word-stars
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: BEHIND_PROXY
        value: "1"
      - key: DATA_DIR
        value: /tmp/data
      - key: FLASK_DEBUG
        value: "0"
      - key: INITIAL_ADMIN_NAME
        value: Apex